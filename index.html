<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBGYN Past Papers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #333;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        select, input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #333;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
        }

        .button-group {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 10px;
            border: 1px solid #333;
            background: #333;
            color: white;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #555;
            border-color: #555;
        }

        .reset-btn {
            background: white;
            color: #333;
            border-color: #ddd;
        }

        .reset-btn:hover {
            background: #f9f9f9;
            border-color: #999;
        }

        .stats {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .questions {
            display: grid;
            gap: 12px;
        }

        .question-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden;
        }

        .question-header {
            padding: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border-bottom: 1px solid #eee;
            user-select: none;
        }

        .question-header:hover {
            background: #f0f0f0;
        }

        .question-id {
            font-weight: 600;
            font-size: 13px;
            color: #333;
        }

        .question-topic {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        .arrow {
            color: #666;
            font-size: 12px;
            transition: transform 0.2s;
        }

        .question-card.open .arrow {
            transform: rotate(180deg);
        }

        .question-content {
            display: none;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        .question-card.open .question-content {
            display: block;
        }

        .question-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: #333;
        }

        .options {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 12px;
            font-size: 13px;
            line-height: 1.6;
            color: #555;
        }

        .option-item {
            padding: 10px 8px;
            margin: 5px 0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .option-item:hover {
            background: #f0f0f0;
            border-color: #ddd;
        }

        .option-item.selected {
            border-color: #333;
            background: #f0f0f0;
        }

        .answer-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
        }

        .answer-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }

        .answer-box {
            display: none;
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }

        .answer-box.show {
            display: block;
        }

        .answer-box.correct {
            background: #d4edda;
            border-left: 3px solid #28a745;
        }

        .answer-box.incorrect {
            background: #f8d7da;
            border-left: 3px solid #dc3545;
        }

        .answer-box.hidden {
            background: #e7f3ff;
            border-left: 3px solid #0066cc;
        }

        .answer-text {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .answer-box.correct .answer-text {
            color: #155724;
        }

        .answer-box.incorrect .answer-text {
            color: #721c24;
        }

        .answer-box.hidden .answer-text {
            color: #004085;
        }

        .explanation {
            font-size: 12px;
            line-height: 1.4;
            margin-top: 5px;
        }

        .answer-box.correct .explanation {
            color: #155724;
        }

        .answer-box.incorrect .explanation {
            color: #721c24;
        }

        .answer-box.hidden .explanation {
            color: #004085;
        }

        .feedback-icon {
            font-size: 18px;
            margin-right: 8px;
        }

        .feedback-text {
            font-weight: 600;
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .correct-answer {
            margin-top: 8px;
            font-size: 12px;
            padding: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OBGYN Past Papers</h1>
            <p class="subtitle">M27 & M28 Clinical Test Questions</p>
        </header>

        <div class="filters">
            <select id="classFilter" onchange="filterQuestions()">
                <option value="">All Classes</option>
                <option value="">--- M27 ---</option>
                <option value="M27_R1">M27 R1</option>
                <option value="M27_R2">M27 R2</option>
                <option value="M27_R3">M27 R3</option>
                <option value="">--- M28 ---</option>
                <option value="M28_R1">M28 R1</option>
                <option value="M28_R2">M28 R2</option>
            </select>

            <select id="topicFilter" onchange="filterQuestions()">
                <option value="">All Topics</option>
                <option value="2">2. Antenatal Care</option>
                <option value="3.1">3.1 Hypertensive Disorder</option>
                <option value="3.2">3.2 Antepartum Haemorrhage</option>
                <option value="5.1">5.1 Mechanism of Labor</option>
                <option value="5.2">5.2 Preterm</option>
                <option value="6">6. Puerperium</option>
                <option value="7.1">7.1 Abnormal Uterine Bleeding</option>
                <option value="7.2">7.2 Amenorrhea & Menopause</option>
                <option value="7.3">7.3 Dysmenorrhea & Endometriosis</option>
                <option value="8">8. Vaginal Discharge</option>
                <option value="9">9. Gynaecological Neoplasms</option>
                <option value="10.1">10.1 Urinary Incontinence</option>
                <option value="10.2">10.2 Pelvic Organ Prolapse</option>
                <option value="11">11. Fertility & Contraception</option>
                <option value="12.1">12.1 Miscarriage & Ectopic</option>
                <option value="12.2">12.2 Termination of Pregnancy</option>
            </select>

            <input type="text" id="searchBox" placeholder="Search..." onkeyup="filterQuestions()">

            <div style="grid-column: 1 / -1;"></div>

            <button onclick="filterQuestions()">Search</button>
            <button class="reset-btn" onclick="resetFilters()">Reset</button>
        </div>

        <div class="stats">
            Showing <strong id="count">0</strong> of <strong id="total">0</strong> questions
        </div>

        <div class="questions" id="questions"></div>
    </div>

    <script>
        const questions = [
            // 2. Antenatal Care
            {id: "M27_R1(22)_Q10", topic: "2", class: "M27_R1", question: "A 27-year-old woman, G1P0, attended her first antenatal check-up at 12 weeks of gestation. She has hypothyroidism requiring thyroxine replacement. Which of the following investigations should be performed to monitor if the replacement is adequate?", options: ["Antibodies against thyroid peroxidase", "Iodine level", "Thyroid function test", "Thyroid ultrasound"], answer: "C", answerText: "Thyroid function test", explanation: ""},
            {id: "M27_R3(1)_Q2", topic: "2", class: "M27_R3", question: "A 42-year-old gravida 1 para 0 patient came to antenatal clinic for her first antenatal visit. She enjoyed good past health. Which of the following routine antenatal screening test(s) should be arranged for her?", options: ["Anomaly scan at first trimester", "Antenatal bloods (MCM, Rhesus, ABO, VDRL, Anti-HIV, HBsAg) at first visit", "Group B streptococcus screening at first visit", "Oral glucose tolerance test at first trimester"], answer: "B", answerText: "Antenatal bloods at first visit", explanation: ""},
            {id: "M27_R2(12)_Q8", topic: "2", class: "M27_R2", question: "A 35-year-old G1P0 woman was 20 weeks pregnant. The fetus was found to have complete heart block on anomaly scan. What is the maternal factor you would investigate?", options: ["Anti cardiolipin", "Anti D", "Anti Rho", "Anti microsomal"], answer: "C", answerText: "Anti Rho", explanation: ""},
            {id: "M27_R2(14)_Q2", topic: "2", class: "M27_R2", question: "Glucose levels: Fasting: 4 mmol/L, 2 hour: 7.6 mmol/L. How would you manage this patient?", options: ["Refer to endocrinologist", "Repeat test", "Normal glucose level and reassure", "Start metformin"], answer: "C", answerText: "Normal glucose level and reassure", explanation: ""},
            {id: "M27_R3(1)_Q9", topic: "2", class: "M27_R3", question: "A 30-year-old woman attended pre-marital checkup. Blood test: Hb 11 g/dL, MCV 68 fL, HbA2 2.5%, occasional Hb H bodies. From Southern China. Which is the most appropriate advice?", options: ["To check the mean corpuscular volume of the husband", "To conceive by in-vitro fertilisation", "To start taking folic acid after confirming pregnancy", "To start taking iron supplement before pregnancy"], answer: "A", answerText: "To check the mean corpuscular volume of the husband", explanation: "HbH disease carrier; need to screen husband"},
            {id: "M27_R3(8)_Q8", topic: "2", class: "M27_R3", question: "A 40-year-old primigravida received high risk first trimester combined Down syndrome screening (1 in 3 chance of T21) at 12 weeks. Patient worried about miscarriage risk. Which is the appropriate management?", options: ["Chorionic villus sampling", "Direct termination of pregnancy", "Morphology scan", "Non-invasive prenatal testing"], answer: "D", answerText: "Non-invasive prenatal testing", explanation: "NIPT has no miscarriage risk"},
            {id: "M28_R1(19)_Q2", topic: "2", class: "M28_R1", question: "A 30-year-old G1P0 woman with BMI 25 attended first antenatal visit at 12 weeks. First trimester combined Down's syndrome screening showed a positive result. How would you manage her?", options: ["Offer amniocentesis at 13 weeks", "Offer chorionic villi sampling at 13 weeks", "Offer termination of pregnancy", "Offer second trimester Down's syndrome screening"], answer: "B", answerText: "Offer chorionic villi sampling at 13 weeks", explanation: ""},
            {id: "M28_R1(19)_Q3", topic: "2", class: "M28_R1", question: "A 30-year-old G1P0 woman with BMI 30 attended antenatal care at 29 weeks. OGTT: 4.5 mmol/L (fasting), 6.0 mmol/L (2hr). What is the next step of management?", options: ["Reassure the patient that results are normal", "Refer to dietician for diet control", "Repeat OGTT the following week", "Start on metformin"], answer: "A", answerText: "Reassure the patient that results are normal", explanation: ""},
            {id: "M28_R1(18)_Q10", topic: "2", class: "M28_R1", question: "38-year old primigravida with high risk 2nd trimester biochemical Down syndrome screening (1 in 10 chance T21) at wk17. US showed fetal AV septal defect and hypoplasia of nasal bone. What is the management?", options: ["Amniocentesis", "Chorionic villus sampling", "NIPT", "Routine morphology scan"], answer: "A", answerText: "Amniocentesis", explanation: ""},
            {id: "M28_R1(20)_Q7", topic: "2", class: "M28_R1", question: "A 30-year-old healthy woman planning to get pregnant gives family history of intellectual disability and congenital deafness in her younger brother. Which is the appropriate management?", options: ["Conduct hearing test", "Counsel on X-linked inheritance", "Offer expanded carrier screening", "Referral to pre-pregnancy genetic counselling"], answer: "D", answerText: "Referral to pre-pregnancy genetic counselling", explanation: ""},

            // 3.1 Hypertensive Disorder
            {id: "M27_R1(21)_Q9", topic: "3.1", class: "M27_R1", question: "A 29-year-old lady is now pregnant at 12 weeks. She has insulin-dependent diabetes for 10 years with fair glycaemic control. Aspirin has been started. What condition may be preventable by aspirin?", options: ["Diabetic ketoacidosis", "Fetal neural tube defect", "Macrosomia", "Pre-eclampsia"], answer: "D", answerText: "Pre-eclampsia", explanation: ""},
            {id: "M27_R3(1)_Q4", topic: "3.1", class: "M27_R3", question: "A 30-year-old G1P0 woman with BMI 30 attended antenatal visit at 38 weeks. Single BP: 145/90 mmHg. Urine dipstix for albumin: negative. How would you manage her?", options: ["Manage as chronic hypertension", "Manage as gestational hypertension", "Manage as pre-eclampsia", "Recheck blood pressure"], answer: "D", answerText: "Recheck blood pressure", explanation: "Single reading needs confirmation"},
            {id: "M28_R2(9)_Q10", topic: "3.1", class: "M28_R2", question: "A 40-year-old woman, G1P0, admitted for headache at 38 weeks' gestation. Epigastric discomfort. BP: 180/100 mmHg. Urine protein: 3+. Found unconscious with witnessed limb twitching.", options: ["Amniotic fluid embolism", "Aortic dissection", "Eclampsia", "Seizure"], answer: "C", answerText: "Eclampsia", explanation: ""},
            {id: "M28_R2(12)_Q10", topic: "3.1", class: "M28_R2", question: "A 32-year-old woman with chronic hypertension seen at 16-week antenatal visit. BP: 130/80 mmHg. Which is the MOST appropriate management?", options: ["Increase antihypertensive medication dosage", "Initiate low-dose aspirin therapy", "Refer for maternal-fetal medicine specialist consultation", "Schedule routine follow-up every 4 weeks"], answer: "B", answerText: "Initiate low-dose aspirin therapy", explanation: ""},

            // 3.2 Antepartum Haemorrhage
            {id: "M27_R1(21)_Q3", topic: "3.2", class: "M27_R1", question: "A 22-year-old nulliparous chronic smoker presents at 35 weeks with heavy vaginal bleeding. PR: 120, BP: 150/100. Uterus tender and irritable. CTG shows fetal bradycardia. What is the diagnosis?", options: ["Placental abruption", "Placenta previa", "Preterm labour", "Vasa previa"], answer: "A", answerText: "Placental abruption", explanation: ""},
            {id: "M27_R2(12)_Q6", topic: "3.2", class: "M27_R2", question: "A 50-year-old nulliparous woman admitted with heavy APH at 36 weeks. History of laparotomy with ovarian cystectomy. Suprapubic transverse scar. What is the likely diagnosis?", options: ["APH of unknown origin", "Placental abruption", "Placenta previa", "Uterine rupture"], answer: "B", answerText: "Placental abruption", explanation: ""},
            {id: "M27_R3(8)_Q1", topic: "3.2", class: "M27_R3", question: "A 38-year-old multiparous woman admitted with heavy APH at 36 weeks. Three previous CS. Uterus soft and non-tender. Fetal head totally above brim. What is the cause?", options: ["Placental abruption", "Placenta previa", "Vasa previa", "Uterine rupture"], answer: "B", answerText: "Placenta previa", explanation: "Soft uterus = previa, not abruption"},
            {id: "M27_R3(8)_Q2", topic: "3.2", class: "M27_R3", question: "A 30-year-old nulliparous woman admitted with heavy APH at 36 weeks. History of laparotomy. Suprapubic scar. Uterus tender and irritable. What is the cause?", options: ["APH of unknown origin", "Placental abruption", "Placenta previa", "Uterine rupture"], answer: "B", answerText: "Placental abruption", explanation: "Tender uterus = abruption"},
            {id: "M28_R2(13)_Q10", topic: "3.2", class: "M28_R2", question: "A 28-year-old woman at 30 weeks diagnosed with GDM (OGTT 9 mmol/L at 2 hours). What is the most appropriate initial management?", options: ["Recommend dietary modifications and self-monitoring", "Refer to endocrinologist", "Schedule follow-up in 4 weeks", "Start insulin therapy immediately"], answer: "A", answerText: "Recommend dietary modifications and self-monitoring", explanation: ""},

            // 5.1 Mechanism of Labor
            {id: "M27_R1(23)_Q5", topic: "5.1", class: "M27_R1", question: "A 30-year-old primiparous woman with GDM in labour. Induced at 39 weeks. After fetal head delivery, unable to deliver body with gentle traction. Turtle sign noted. What is the diagnosis?", options: ["Cephalopelvic disproportion", "Malpresentation", "Prolonged second stage", "Shoulder dystocia"], answer: "D", answerText: "Shoulder dystocia", explanation: ""},
            {id: "M28_R1(19)_Q6", topic: "5.1", class: "M28_R1", question: "A 25-year-old primiparous woman with GDM in labour. Induced at 39 weeks. Fetal head delivered 45 min after full cervical dilation. Unable to deliver body. Turtle sign noted. What is the diagnosis?", options: ["Cephalopelvic disproportion", "Malpresentation", "Prolonged second stage", "Shoulder dystocia"], answer: "D", answerText: "Shoulder dystocia", explanation: ""},
            {id: "M27_R2(14)_Q4", topic: "5.1", class: "M27_R2", question: "There is slow progress in cervix dilatation. Who to inform?", options: ["Intern", "Obstetrician", "Midwife"], answer: "B", answerText: "Obstetrician", explanation: ""},
            {id: "M28_R1(18)_Q4", topic: "5.1", class: "M28_R1", question: "A 40-year-old G1P0 admitted at 39 weeks with regular contractions. Show and clear liquor leaking. Cervix 5cm, DOP, +1 station, 2cm caput, 2+ moulding. Who to call?", options: ["Anaesthesiologist", "Interns", "Medical Officer", "Paediatrician"], answer: "C", answerText: "Medical Officer", explanation: ""},
            {id: "M28_R1(20)_Q4", topic: "5.1", class: "M28_R1", question: "A 30-year-old at 36 weeks wants to avoid medical intervention during delivery. Which is part of physiological 3rd stage management?", options: ["Early clamping of cord", "Controlled cord traction", "Encourage maternal effort to expel placenta", "Use of syntometrine"], answer: "C", answerText: "Encourage maternal effort to expel placenta", explanation: ""},
            {id: "M28_R2(12)_Q1", topic: "5.1", class: "M28_R2", question: "A 25-year-old primiparous with GDM in labour. Induced at 39 weeks. Fetal head delivered 45 min after full dilation. Unable to deliver body. Turtle sign. What is the diagnosis?", options: ["Cephalopelvic disproportion", "Malpresentation", "Prolonged second stage", "Shoulder dystocia"], answer: "D", answerText: "Shoulder dystocia", explanation: ""},

            // 5.2 Preterm
            {id: "M27_R1(23)_Q1", topic: "5.2", class: "M27_R1", question: "A 25-year-old G1P0 admitted for left lower quadrant pain at 32 weeks. Sudden onset, sharp, persistent. No vaginal bleeding. PR: 100, BP: 120/80. Afebrile. Right lower quadrant tenderness with guarding. What is the diagnosis?", options: ["Acute appendicitis", "Bowel colic", "Threatened preterm labor", "Urinary colic"], answer: "A", answerText: "Acute appendicitis", explanation: ""},

            // 6. Puerperium
            {id: "M27_R1(21)_Q1", topic: "6", class: "M27_R1", question: "A 40-year-old G5P4 admitted in labour with 4 previous vaginal deliveries. GDM, induced at 38 weeks. 1st stage: 6 hours, 2nd stage: 10 min. NSD, baby weight: 4kg. Profuse vaginal bleeding after placenta. What is the cause?", options: ["Coagulopathy", "Retained products", "Uterine atony", "Vaginal tear"], answer: "C", answerText: "Uterine atony", explanation: ""},
            {id: "M27_R1(21)_Q2", topic: "6", class: "M27_R1", question: "A 40-year-old G2P0 admitted at 37 weeks with first episode vaginal bleeding. Low-lying placenta covering os. No contraction or pain. Fetus active. BP: 100/60, PR: 108. Speculum: loose os with profuse bleeding. What is the management?", options: ["Conservative with fetal heart monitoring", "Conservative with maternal BP/pulse monitoring", "Emergency Caesarean section", "Digital vaginal examination"], answer: "C", answerText: "Emergency Caesarean section", explanation: ""},
            {id: "M27_R1(22)_Q2", topic: "6", class: "M27_R1", question: "A 31-year-old G2P2 delivered NSD 5 days ago. Blood loss: 400ml. Readmitted for increased bleeding. Vitals stable. Uterus 16 weeks size, loose os, no cervical excitation. Blood loss 500ml. What is the diagnosis?", options: ["Primary PPH", "Primary and secondary PPH", "Secondary PPH", "Return of menses"], answer: "C", answerText: "Secondary PPH", explanation: "Bleeding >24h after delivery"},
            {id: "M27_R1(22)_Q3", topic: "6", class: "M27_R1", question: "A 38-year-old G1P0 admitted for elective CS for twin pregnancy. CS done. Total blood loss: 2.6L. Twin 1: 2.3kg, Twin 2: 2.4kg. Placenta complete. Profuse vaginal bleeding in recovery. Uterus well-contracted. What is the diagnosis?", options: ["Coagulopathy", "Placenta previa", "Retained placenta", "Uterine inversion"], answer: "A", answerText: "Coagulopathy", explanation: ""},
            {id: "M27_R1(22)_Q8", topic: "6", class: "M27_R1", question: "A 20-year-old delivered vaginally with PPH due to uterine atony. Given IM syntometrine, IV fluids, massage, IV oxytocin, tranexamic acid, misoprostol, and 2x IM carboprost. Contractions improved but slow bleeding continues. What next?", options: ["Examination under anesthesia", "Uterine artery embolization", "Third dose IM carboprost", "Transfer to adult ICU"], answer: "A", answerText: "Examination under anesthesia", explanation: ""},
            {id: "M27_R1(23)_Q2", topic: "6", class: "M27_R1", question: "A 38-year-old G1P0 with twin pregnancy admitted for leaking at 36 weeks. History of uterine fibroids (max 6cm). Emergency LSCS for breech. Uterine atony, intraoperative loss: 1000ml. What are the risk factors for PPH?", options: ["Advanced age and twin pregnancy", "Twin pregnancy and uterine fibroids", "Twin pregnancy and PROM", "Uterine fibroids and PROM"], answer: "B", answerText: "Twin pregnancy and uterine fibroids", explanation: ""},
            {id: "M27_R1(23)_Q6", topic: "6", class: "M27_R1", question: "A 22-year-old develops primary PPH due to uterine atony after NSD. Which should be given for treatment?", options: ["Blood Transfusion", "Pethidine injection", "Tranexamic acid", "Uterotonic agent"], answer: "D", answerText: "Uterotonic agent", explanation: ""},
            {id: "M27_R1(23)_Q7", topic: "6", class: "M27_R1", question: "A 30-year-old G1P1 delivered by LSCS 5 days ago. Admitted for increased bleeding (2 pads with clots). Temp: 38°C, BP: 135/85, PR: 105. Cervical excitation and uterine tenderness. What is the diagnosis?", options: ["Endometritis", "Retained products", "UTI", "Uterine rupture"], answer: "A", answerText: "Endometritis", explanation: ""},
            {id: "M27_R2(12)_Q2", topic: "6", class: "M27_R2", question: "A 33-year-old G5P0 with 4 surgical TOPs delivered vaginally. Traction applied to deliver placenta. Difficulty encountered. Vaginal bleeding not heavy. Mass protruded with profuse bleeding. Placenta still in-situ. What is the diagnosis?", options: ["Uterine inversion", "Uterine atony", "Lower genital trauma", "Genital prolapse"], answer: "A", answerText: "Uterine inversion", explanation: ""},
            {id: "M27_R2(12)_Q4", topic: "6", class: "M27_R2", question: "28-year-old with G5P0 and multiple surgical TOP admitted in labour at 40 weeks. Delivered baby 3.9kg by SVD. Heavy vaginal bleeding. BP: 80/40, PR: 120. What is the immediate management?", options: ["IV fluid resuscitation", "IV oxygen", "IV tranexamic acid", "Emergency manual removal of placenta"], answer: "A", answerText: "IV fluid resuscitation", explanation: ""},
            {id: "M27_R2(12)_Q5", topic: "6", class: "M27_R2", question: "A 32-year-old woman suffers 1000mL PPH 15 min after delivery due to uterine atony. Given several drugs and bleeding stops. One hour later, BP: 170/120. Which drug likely responsible?", options: ["Carboprost", "Magnesium sulphate", "Oxytocin", "Syntometrine"], answer: "D", answerText: "Syntometrine", explanation: "Contains ergotamine causing vasoconstriction"},
            {id: "M27_R2(14)_Q1", topic: "6", class: "M27_R2", question: "A 35-year-old G1P0 with poorly controlled asthma delivered by vacuum extraction. Baby 4.5kg. Primary PPH due to uterine atony. Already given IV syntocinon but continuous heavy bleeding. Placenta complete.", options: ["Expectant management", "IM carboprost", "Oral tranexamic acid", "Rectal misoprostol"], answer: "D", answerText: "Rectal misoprostol", explanation: "Carboprost C/I in asthma"},
            {id: "M27_R2(14)_Q3", topic: "6", class: "M27_R2", question: "Multiple TOP G5P0 woman with SVD. Placenta delivered. Woman becomes hypotensive with PPH. What is most appropriate management?", options: ["Send for OT +/- placenta removal", "Send for OT +/- repair", "IV Oxytocic", "Uterine compressive suture"], answer: "C", answerText: "IV Oxytocic", explanation: ""},
            {id: "M27_R2(14)_Q6", topic: "6", class: "M27_R2", question: "A 35-year-old woman with multiple uterine fibroids had full term NSD. Placenta delivered. Ongoing bleeding 600ml. BP: 82/60, PR: 110. Uterus 2 finger breadths above umbilicus, no perineal tear. What is the cause?", options: ["Coagulopathy", "Local trauma", "Multiple fibroids", "Uterine Atony"], answer: "D", answerText: "Uterine Atony", explanation: ""},
            {id: "M27_R3(1)_Q1", topic: "6", class: "M27_R3", question: "A 24-year-old woman, G5P1, delivered first baby vaginally. 4 previous STP. Difficulty during placenta delivery. Eventually 40 min later. Profuse vaginal bleeding. What was the cause?", options: ["Retained products", "Underlying bleeding tendency", "Uterine atony", "Vaginal tear"], answer: "A", answerText: "Retained products", explanation: ""},
            {id: "M27_R3(1)_Q6", topic: "6", class: "M27_R3", question: "A 32-year-old woman with known multiple fibroids had precipitous labour. Vaginal delivery complicated by PPH of 3L. What is the underlying cause?", options: ["Atonic uterus", "DIC", "Genital trauma", "Retained products"], answer: "A", answerText: "Atonic uterus", explanation: ""},
            {id: "M27_R3(8)_Q3", topic: "6", class: "M27_R3", question: "You are on-call intern for PPH patient at 4am. G4P1 with 3 TOPs. Antenatal and delivery smooth. Total loss: 800mL. Suspected retained placenta. Who to call?", options: ["Anesthesiologist", "Extra intern", "Medical officer", "Senior midwife"], answer: "C", answerText: "Medical officer", explanation: ""},
            {id: "M27_R3(8)_Q4", topic: "6", class: "M27_R3", question: "A 40-year-old grand multiparous woman delivered via NSD of 3kg male. Placenta removed without difficulty. Delivery complicated by PPH of 1.2L. What is the cause?", options: ["AFE", "Genital trauma", "Retained products", "Uterine atony"], answer: "D", answerText: "Uterine atony", explanation: ""},
            {id: "M28_R1(19)_Q4", topic: "6", class: "M28_R1", question: "A 28-year-old, G5P0, with multiple surgical TOP admitted in labour at 40 weeks. Delivered baby 3.0kg by SVD. Heavy bleeding. BP: 80/40, PR: 120. What is immediate management?", options: ["Emergency placenta removal", "IV fluid resuscitation", "IV oxytocin", "IV tranexamic acid"], answer: "B", answerText: "IV fluid resuscitation", explanation: ""},
            {id: "M28_R1(19)_Q8", topic: "6", class: "M28_R1", question: "A 30-year-old G1P1 with medical TOP 2 weeks ago. Admitted for increased bleeding (2 pads with clots). Afebrile, BP: 135/85, PR: 105. No cervical excitation. What is the diagnosis?", options: ["Endometritis", "Retained products", "UTI", "Uterine rupture"], answer: "B", answerText: "Retained products", explanation: ""},
            {id: "M28_R1(18)_Q6", topic: "6", class: "M28_R1", question: "36-year-old with heavy vaginal bleeding following vaginal twin delivery at week 37. Placenta smoothly delivered. No episiotomy. Blood loss 800ml. What is the cause?", options: ["Genital trauma", "Retained placenta", "Uterine atony", "Uterine inversion"], answer: "C", answerText: "Uterine atony", explanation: ""},
            {id: "M28_R1(20)_Q1", topic: "6", class: "M28_R1", question: "A 32-year-old nulliparous woman has massive obstetric hemorrhage during emergency CS. Develops DIC. Which lab result expected?", options: ["Decreased aPTT", "Increased factor VII", "Increased fibrinogen", "Thrombocytopenia"], answer: "D", answerText: "Thrombocytopenia", explanation: ""},
            {id: "M28_R1(20)_Q6", topic: "6", class: "M28_R1", question: "A 29-year-old in first pregnancy had full term NSD. Vagina and perineum intact. Placenta failed to deliver after 30 minutes. Heavy loss 1000ml. BP: 70/50, PR: 120. What is management?", options: ["IM carboprost", "Intraumbilical syntocinon", "Urgent manual removal under GA", "Intrauterine balloon"], answer: "C", answerText: "Urgent manual removal under GA", explanation: ""},
            {id: "M28_R2(9)_Q8", topic: "6", class: "M28_R2", question: "A 35-year-old woman develops painful vulval swelling soon after vaginal delivery. What is the cause?", options: ["Cellulitis", "Dilated varicose veins", "Vulval edema", "Vulval haematoma"], answer: "D", answerText: "Vulval haematoma", explanation: ""},
            {id: "M28_R2(11)_Q7", topic: "6", class: "M28_R2", question: "A 38-year-old G1P0 in good health admitted for elective CS for twin pregnancy. Total blood loss: 2.6L. Twins: 2.3kg and 2.4kg. Placenta complete. Profuse bleeding in recovery. Uterus well-contracted. What is next management?", options: ["Balloon tamponade", "Examination under anesthesia", "Suction evacuation", "Blood Transfusion"], answer: "D", answerText: "Blood Transfusion", explanation: ""},
            {id: "M28_R2(12)_Q9", topic: "6", class: "M28_R2", question: "A 43-year-old G6P1 with one previous CS and 4 previous surgical TOP. Successfully underwent TOLAC. Baby delivered 10 min ago, heavy PPH (2L). Uterus contracted, fundus at umbilicus. What is the cause?", options: ["DIC", "Genital tears", "Retained products", "Uterine rupture"], answer: "C", answerText: "Retained products", explanation: ""},
            {id: "M28_R2(13)_Q1", topic: "6", class: "M28_R2", question: "A 35-year-old G1P0 with poorly controlled asthma delivered by vacuum extraction. Baby 4.5kg. Primary PPH due to uterine atony. Given IV syntocinon but continuous bleeding. Placenta complete.", options: ["Expectant management", "IM carboprost", "Oral tranexamic acid", "Sublingual misoprostol"], answer: "D", answerText: "Sublingual misoprostol", explanation: "Carboprost C/I in asthma"},
            {id: "M28_R2(13)_Q5", topic: "6", class: "M28_R2", question: "A 32-year-old woman readmitted 10 days after emergency CS with swollen painful calf. Observations stable. Obese, BMI 40. What is the diagnosis?", options: ["Cellulitis", "Deep vein thrombosis", "Muscle strain", "Phlebitis"], answer: "B", answerText: "Deep vein thrombosis", explanation: ""},
            {id: "M28_R2(14)_Q1", topic: "6", class: "M28_R2", question: "A 38-year-old nulliparous lady had emergency LSCS for PPROM at 35 weeks 1 hour ago. Blood loss: 1L. PR: 130, BP: 80/40, Temp: 37.1°C. Floppy uterus with ongoing bleeding. On syntocinon. Besides fluids, what treatment?", options: ["Carboprost", "Misoprostol", "Synometrine", "Tranexamic acid"], answer: "A", answerText: "Carboprost", explanation: ""},
            {id: "M28_R2(14)_Q4", topic: "6", class: "M28_R2", question: "A 36-year-old G1P0 admitted for leaking at 36 weeks. Gush of clear fluid with continuous leaking. Irregular contractions. Soft, nontender uterus. Cephalic, 5/5 above brim. NST: baseline 150, variability 5-10, accelerations, recurrent variable decel to 90 for 2 min. What is diagnosis?", options: ["Cord prolapse", "Placenta previa", "Placental abruption", "Uterine rupture"], answer: "A", answerText: "Cord prolapse", explanation: ""},

            // 7.1 Abnormal Uterine Bleeding
            {id: "M27_R1(23)_Q4", topic: "7.1", class: "M27_R1", question: "A 22-year-old student presented with irregular menses (90-180 day cycle). Pelvic US found polycystic ovaries. Which condition can be prevented by progestogen withdrawal bleeding?", options: ["Breast cancer", "Diabetes mellitus", "Endometrial cancer", "Ovarian cancer"], answer: "C", answerText: "Endometrial cancer", explanation: ""},

            // 7.2 Amenorrhea
            {id: "M28_R1(20)_Q10", topic: "7.2", class: "M28_R1", question: "A 51-year-old woman had total hysterectomy and bilateral salpingo-oophorectomy for fibroids 6 weeks ago. Pathology: benign. Severe hot flushes affecting sleep. Good health, BMI 23, non-smoker. What management?", options: ["Oral estrogen only", "Oral estrogen and progestogen", "Oral progestogen only", "Vaginal estrogen"], answer: "A", answerText: "Oral estrogen only", explanation: "Post-hysterectomy: estrogen only"},

            // 7.3 Dysmenorrhea
            {id: "M27_R2(12)_Q7", topic: "7.3", class: "M27_R2", question: "A 15-year-old girl admitted for acute retention of urine and lower abdominal pain. No menarche but monthly pain for 4 months. Normal development. What is the diagnosis?", options: ["MRKH syndrome", "Red degeneration of fibroid", "Imperforate hymen", "Fitz-Hugh-Curtis syndrome"], answer: "C", answerText: "Imperforate hymen", explanation: ""},
            {id: "M27_R3(8)_Q6", topic: "7.3", class: "M27_R3", question: "A 15-year-old girl admitted for acute retention of urine and lower abdominal pain. No menarche but monthly pain for 4 months. On exam: 16 weeks' pelvic mass, bluish bulge from vagina on Valsalva. What is diagnosis?", options: ["Fitz-Hugh-Curtis syndrome", "Imperforate hymen", "MRKH syndrome", "Red degeneration of fibroids"], answer: "B", answerText: "Imperforate hymen", explanation: ""},
            {id: "M27_R2(14)_Q7", topic: "7.3", class: "M27_R2", question: "Menarche at 13, 6 weeks abdominal pain, bluish bulge at introitus on straining, normal pubic hair. What is the diagnosis?", options: ["Imperforate hymen", "MRKH", "Transverse septum"], answer: "A", answerText: "Imperforate hymen", explanation: ""},
            {id: "M28_R1(20)_Q8", topic: "7.3", class: "M28_R1", question: "A 15-year-old girl presented with pelvic mass and acute retention of urine. No menarche. Past 6 months: pain every few weeks (2-3 days). Normal development. 12 weeks' mass, bluish bulge at introitus on straining. What is diagnosis?", options: ["Androgen insensitivity", "Imperforate hymen", "Ovarian tumour", "Premature ovarian insufficiency"], answer: "B", answerText: "Imperforate hymen", explanation: ""},

            // 8. Vaginal Discharge
            {id: "M27_R1(22)_Q9", topic: "8", class: "M27_R1", question: "A 30-year-old pregnant woman admitted at 38 weeks with ROM. GBS screening at 35 weeks: positive. Uneventful pregnancy. No NKDA. Exam: appropriate size, cephalic, normal FHR, clear liquor. Afebrile. Which is appropriate action?", options: ["Discharge and return with pain", "Give IV benzylpenicillin after checking allergy", "Give oral penicillin after checking allergy", "Emergency CS immediately"], answer: "B", answerText: "Give IV benzylpenicillin after checking allergy", explanation: ""},
            {id: "M27_R2(12)_Q3", topic: "8", class: "M27_R2", question: "A 19-year-old bartender G3P0 with 3 TOP admitted with severe bilateral lower abdominal pain and fever. Multiple partners. BP: 90/45, PR: 124, Temp: 39°C. Lower tenderness, no guarding. Cervical excitation. Pregnancy test negative. What is management?", options: ["Laparotomy", "Resuscitation and Antibiotics", "Emergency contraception", "US pelvis"], answer: "B", answerText: "Resuscitation and Antibiotics", explanation: ""},
            {id: "M27_R2(12)_Q9", topic: "8", class: "M27_R2", question: "Which of the following is an adverse factor for natural defense mechanism in female genitals?", options: ["Alkaline lochia", "Apposition of labia and vagina", "Vaginal microbiome", "Stratified squamous epithelium"], answer: "A", answerText: "Alkaline lochia", explanation: ""},
            {id: "M27_R2(14)_Q9", topic: "8", class: "M27_R2", question: "Strawberry cervix sign indicates?", options: ["Candida albicans", "Gonorrhea", "Trichomonas", "Chlamydia"], answer: "C", answerText: "Trichomonas", explanation: ""},
            {id: "M27_R3(8)_Q7", topic: "8", class: "M27_R3", question: "A 23-year-old woman admitted for lower abdominal pain and fever. Sexually active, 3 partners. Lower tenderness. Foul-smelling discharge on speculum, cervical excitation on exam. Which is appropriate management?", options: ["Single dose IM ceftriaxone + doxycycline + metronidazole", "Single dose oral azithromycin", "Single dose oral metronidazole", "IV ceftriaxone + oral doxycycline"], answer: "D", answerText: "IV ceftriaxone + oral doxycycline", explanation: "Acute PID requiring admission"},
            {id: "M28_R1(18)_Q9", topic: "8", class: "M28_R1", question: "What is an adverse factor in vaginal infection defense mechanism?", options: ["Alkaline lochia", "Apposition of labia and vagina", "Vaginal microbiome", "Stratified squamous epithelium"], answer: "A", answerText: "Alkaline lochia", explanation: ""},
            {id: "M28_R1(20)_Q2", topic: "8", class: "M28_R1", question: "A 20-year-old woman presented with lower abdominal pain and fever. Multiple partners. Pain started 1 day ago, persistent. BP: 120/80, PR: 110, Temp: 39°C. Lower tenderness but no peritoneal signs. Cervical excitation. What is diagnosis?", options: ["Acute appendicitis", "Acute PID", "Ovary cyst torsion", "Ruptured ectopic pregnancy"], answer: "B", answerText: "Acute PID", explanation: ""},

            // 9. Gynaecological Neoplasms
            {id: "M27_R1(21)_Q6", topic: "9", class: "M27_R1", question: "A 62-year-old attended A&E for abdominal pain. Generalized tenderness, 24-week pelvic mass. US: 18cm unilocular right ovarian cyst, no solid area. What is appropriate management?", options: ["Laparoscopic ovarian cystectomy", "Laparoscopic bilateral salpingo-oophorectomy", "Laparotomy and bilateral salpingo-oophorectomy", "Refer oncology"], answer: "C", answerText: "Laparotomy and bilateral salpingo-oophorectomy", explanation: "Large cyst, elderly, acute presentation"},
            {id: "M27_R1(21)_Q7", topic: "9", class: "M27_R1", question: "A 45-year-old woman presented with postcoital bleeding. Exam: 1cm exophytic growth on cervix. Which investigation next?", options: ["Cervical biopsy", "Cervical smear", "Colposcopy", "HPV test"], answer: "A", answerText: "Cervical biopsy", explanation: "Visible lesion requires direct biopsy"},
            {id: "M27_R1(22)_Q4", topic: "9", class: "M27_R1", question: "A 40-year-old woman presented with cervical smear showing low-grade squamous intraepithelial lesion. What is appropriate management?", options: ["Perform colposcopy", "Repeat cervical smear today", "Repeat cervical smear 4 months later", "Repeat cervical smear 6 months later"], answer: "A", answerText: "Perform colposcopy", explanation: ""},
            {id: "M27_R1(22)_Q6", topic: "9", class: "M27_R1", question: "A 35-year-old woman presents to A&E with severe abdominal pain. History of ovarian cystectomy for endometriotic cysts 2 years ago. PR: 100, BP: 90/50. Pregnancy test negative. What is diagnosis?", options: ["Acute appendicitis", "Ovarian cyst complication", "Ruptured ectopic pregnancy", "UTI"], answer: "B", answerText: "Ovarian cyst complication", explanation: ""},
            {id: "M27_R1(22)_Q7", topic: "9", class: "M27_R1", question: "A 35-year-old woman presents to A&E with severe lower abdominal pain. Pregnancy test negative. History of 3cm left dermoid cyst. Suspected ovarian torsion. Which spinal segments nerve to ovaries?", options: ["S2-S4", "T11-T12", "L1", "T9-T10"], answer: "D", answerText: "T9-T10", explanation: ""},
            {id: "M27_R1(23)_Q8", topic: "9", class: "M27_R1", question: "A 23-year-old attended A&E for abdominal pain. Generalized tenderness, 24-week pelvic mass. US: 18cm multilocular left cyst, no solid area. What is appropriate management?", options: ["Laparoscopic cystectomy", "Laparoscopic salpingo-oophorectomy", "Laparotomy with cystectomy", "Staging laparotomy"], answer: "C", answerText: "Laparotomy with cystectomy", explanation: "Large multilocular cyst requires open approach"},
            {id: "M27_R1(23)_Q10", topic: "9", class: "M27_R1", question: "A 55-year-old woman presents with intermittent postmenopausal vaginal bleeding for 6 months. Married, 2 children. Last smear 4 years ago (normal). Speculum: 2cm exophytic growth on posterior cervix with contact bleeding. What is diagnosis?", options: ["Cervical cancer", "Cervical ectropion", "Cervical fibroid", "Cervical polyp"], answer: "A", answerText: "Cervical cancer", explanation: ""},
            {id: "M27_R2(14)_Q10", topic: "9", class: "M27_R2", question: "Surgery for endometrial cancer with no fertility wish. What is the procedure?", options: ["Vaginal hysterectomy", "TAH + BSO", "Myomectomy", "Endometrial ablation"], answer: "B", answerText: "TAH + BSO", explanation: ""},
            {id: "M27_R3(1)_Q10", topic: "9", class: "M27_R3", question: "A 30-year-old woman just completed 3 doses of HPV vaccine. Good health. Last smear 1 year ago (first, negative). When next cervical smear?", options: ["No need for further smear", "Now", "One year later", "Two years later"], answer: "B", answerText: "Now", explanation: ""},
            {id: "M27_R3(8)_Q5", topic: "9", class: "M27_R3", question: "A 55-year-old woman complained of postmenopausal vaginal bleeding for 4 months. Married, 4 children, good health. Last smear 15 years ago (normal). Speculum: 3cm exophytic growth on anterior cervix with contact bleeding. Which is most important initial investigation?", options: ["Cervical biopsy", "Cervical smear", "Colposcopy", "Endometrial aspirate"], answer: "A", answerText: "Cervical biopsy", explanation: "Visible lesion requires direct biopsy"},
            {id: "M27_R3(8)_Q10", topic: "9", class: "M27_R3", question: "A 21-year-old woman incidentally found to have left ovarian cyst (2x2.5x1cm) with thin septae, no vascular flow. Regular menses, no dysmenorrhea. Which is most appropriate management?", options: ["Check CA-125", "Combined oral contraceptive", "Laparoscopic cystectomy", "Observation and repeat US in 6 months"], answer: "D", answerText: "Observation and repeat US in 6 months", explanation: "Benign features, small lesion"},
            {id: "M28_R1(19)_Q7", topic: "9", class: "M28_R1", question: "A 29-year-old woman attended A&E for acute abdominal pain and vomiting. Never sexually active. Abdominal exam: guarding and rigidity over left lower quadrant. What is diagnosis?", options: ["Acute appendicitis", "Diverticulitis", "Ovarian cyst torsion", "PID"], answer: "C", answerText: "Ovarian cyst torsion", explanation: ""},
            {id: "M28_R1(18)_Q5", topic: "9", class: "M28_R1", question: "38-year-old admitted for acute onset lower abdominal pain with nausea. RLQ tenderness with guarding. Recent pelvic US 2 months ago: 6cm ovarian cyst. Afebrile. Pregnancy test negative. What is management?", options: ["Laparoscopic cystectomy", "Laparoscopic salpingo-oophorectomy", "Repeat US in 4 months", "US-guided aspiration"], answer: "A", answerText: "Laparoscopic cystectomy", explanation: ""},
            {id: "M28_R1(20)_Q9", topic: "9", class: "M28_R1", question: "A 66-year-old woman complained of abdominal swelling for 3 months. Abdominal exam: 18 weeks' mass. US: small free fluid, 10cm cystic lesion with 1cm solid area. Both ovaries not visualized. Which is appropriate management?", options: ["CT scan", "Diagnostic laparoscopy and biopsy", "Repeat US 3-4 months later", "US-guided biopsy"], answer: "A", answerText: "CT scan", explanation: "Suspect malignancy; need staging"},
            {id: "M28_R2(9)_Q1", topic: "9", class: "M28_R2", question: "An 18-year-old lady admitted for sudden onset abdominal pain. Tenderness and rigidity over right abdomen. Suspected ovarian cyst torsion. What is the spinal segment nerve supply?", options: ["L2-L3", "S2-S4", "T9-T10", "T11-T12"], answer: "C", answerText: "T9-T10", explanation: ""},
            {id: "M28_R2(9)_Q3", topic: "9", class: "M28_R2", question: "A 68-year-old woman presented to gyn clinic for vaginal spotting since 2 weeks. LMP 15 years ago. Good health. Married with 2 vaginal deliveries. Regular checkup, normal. What is appropriate investigation?", options: ["Cervical smear", "Complete blood count", "Endometrial aspirate", "Pelvic US"], answer: "C", answerText: "Endometrial aspirate", explanation: ""},
            {id: "M28_R2(12)_Q5", topic: "9", class: "M28_R2", question: "A 62-year-old woman, sexually inactive, complained of postmenopausal bleeding for 4 months. Enlarged uterus 12 weeks' size. Cannot tolerate vaginal exam. US: 12cm uterus, 7mm endometrial thickness. What is appropriate management?", options: ["Hysteroscopy and endometrial biopsy", "Observation and repeat US in 6 months", "Oral progestagen", "Total hysterectomy and salpingo-oophorectomy"], answer: "A", answerText: "Hysteroscopy and endometrial biopsy", explanation: ""},
            {id: "M28_R2(12)_Q8", topic: "9", class: "M28_R2", question: "A 23-year-old nulliparous woman presented with chronic pelvic pain. US: increasing size of 10cm endometrioma in right ovary. What is best management?", options: ["Combined oral contraceptive", "Laparoscopic cystectomy", "Laparoscopic salpingo-oophorectomy", "Repeat routine pelvic US"], answer: "B", answerText: "Laparoscopic cystectomy", explanation: "Young nulliparous; preserve ovary"},
            {id: "M28_R2(13)_Q7", topic: "9", class: "M28_R2", question: "Ms Chan is 53 years old with persistent vaginal bleeding for 2 months. Menopause at 49. Latest smear 1 year ago (negative). Family history colon cancer. Obese, BMI 34. Pelvic exam: bulky uterus. Transvaginal US: 14mm endometrial thickness with multicystic appearance. What is diagnosis?", options: ["Atrophic vaginitis", "Cervical polyp", "Endometrial cancer", "Endometritis"], answer: "C", answerText: "Endometrial cancer", explanation: ""},
            {id: "M28_R2(13)_Q8", topic: "9", class: "M28_R2", question: "A 12-year-old girl presents to A&E with lower abdominal pain. Large pelvic mass on exam. Transabdominal US: bilateral cystic and solid ovarian tumours. What is diagnosis?", options: ["Epithelial ovarian cancer", "Mature cystic teratoma", "Ovarian fibroadenoma", "Sex cord tumour"], answer: "B", answerText: "Mature cystic teratoma", explanation: ""},
            {id: "M28_R2(13)_Q9", topic: "9", class: "M28_R2", question: "A 25-year-old woman presents with sudden-onset left lower quadrant pain with nausea and vomiting. Sexually active. Uses Mirena IUD. Otherwise healthy. Afebrile. Abdominal exam: left lower quadrant tenderness, no rebound. Pelvic: normal cervix, no discharge, no cervical excitation, fullness at left adnexa. Pregnancy test negative. What is diagnosis?", options: ["Diverticulitis", "Ectopic pregnancy", "Ovarian torsion", "Tubo-ovarian abscess"], answer: "C", answerText: "Ovarian torsion", explanation: ""},
            {id: "M28_R2(14)_Q3", topic: "9", class: "M28_R2", question: "A 30-year-old woman attended gyn outpatient clinic with incidental US finding of 5cm dermoid ovarian cyst. Asymptomatic. What is appropriate management plan?", options: ["Arrange elective laparoscopic cystectomy", "Arrange emergency laparoscopic cystectomy", "Arrange further imaging with MRI", "Check serum CA125"], answer: "A", answerText: "Arrange elective laparoscopic cystectomy", explanation: ""},

            // 10.1 Urinary Incontinence
            {id: "M27_R1(21)_Q8", topic: "10.1", class: "M27_R1", question: "A 60-year-old woman with good health presented with urinary incontinence for 1 year. No dysuria. Incontinence occurs with coughing, sneezing, and urgency. MSU culture negative. What is the diagnosis?", options: ["Mixed urinary incontinence", "Overflow urinary incontinence", "Stress urinary incontinence", "Urgency urinary incontinence"], answer: "A", answerText: "Mixed urinary incontinence", explanation: "Stress + urgency = mixed"},
            {id: "M27_R1(21)_Q5", topic: "10.1", class: "M27_R1", question: "A 36-year-old G1P0 admitted at 29 weeks for gush of fluid 2 hours ago. Speculum: clear liquor leaking. US: breech, normal, reduced liquor. Hospitalized. 5 days later, mass from vagina while straining. Loop of cord without pulsation, no fetal heart. What is diagnosis?", options: ["Early neonatal death", "Neonatal death", "Silent miscarriage", "Stillbirth"], answer: "D", answerText: "Stillbirth", explanation: ""},
            {id: "M28_R2(12)_Q7", topic: "10.1", class: "M28_R2", question: "Mrs Chan complained of urinary incontinence on coughing, confirmed during physical exam. BMI 35. What is diagnosis?", options: ["Overflow urinary incontinence", "Physiological urinary incontinence", "Stress urinary incontinence", "Urgency urinary incontinence"], answer: "C", answerText: "Stress urinary incontinence", explanation: ""},

            // 10.2 POP
            {id: "M27_R1(23)_Q9", topic: "10.2", class: "M27_R1", question: "A 60-year-old patient presented complaining of lump at introitus on straining. You're about to examine her. What position should patient adopt?", options: ["Lithotomy position", "Prone position", "Supine position", "Orthopneic position"], answer: "A", answerText: "Lithotomy position", explanation: ""},
            {id: "M27_R2(12)_Q10", topic: "10.2", class: "M27_R2", question: "A 60-year-old patient presented with lump at introitus on straining. Diagnosed with POP. Doesn't want surgery. What is the management?", options: ["Conservative treatment", "Pessary", "Sacrocolpopexy", "Vaginal hysterectomy with pelvic floor repair"], answer: "B", answerText: "Pessary", explanation: ""},

            // 11. Fertility and Contraception

        function init() {
            document.getElementById('total').textContent = questions.length;
            filterQuestions();
        }

        function filterQuestions() {
            const classVal = document.getElementById('classFilter').value;
            const topicVal = document.getElementById('topicFilter').value;
            const searchVal = document.getElementById('searchBox').value.toLowerCase();

            const filtered = questions.filter(q => {
                const classMatch = !classVal || q.class === classVal;
                const topicMatch = !topicVal || q.topic === topicVal;
                const searchMatch = !searchVal || 
                    q.question.toLowerCase().includes(searchVal) ||
                    q.answerText.toLowerCase().includes(searchVal) ||
                    q.id.toLowerCase().includes(searchVal);
                return classMatch && topicMatch && searchMatch;
            });

            displayQuestions(filtered);
            document.getElementById('count').textContent = filtered.length;
        }

        function displayQuestions(filtered) {
            const container = document.getElementById('questions');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">No questions found</div>';
                return;
            }

            filtered.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                
                const optionsHtml = q.options.length > 0 ? `
                    <div class="options">
                        ${q.options.map((o, i) => {
                            const letter = String.fromCharCode(65 + i);
                            return `
                                <div class="option-item" data-answer="${letter}" data-correct="${q.answer}" data-index="${index}">
                                    <strong>${letter}.</strong> ${o}
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="question-header" onclick="this.parentElement.classList.toggle('open')">
                        <div>
                            <div class="question-id">${q.id}</div>
                            <div class="question-topic">Topic ${q.topic} • ${q.class}</div>
                        </div>
                        <div class="arrow">▼</div>
                    </div>
                    <div class="question-content">
                        <div class="question-text">${q.question}</div>
                        ${optionsHtml}
                        <button class="answer-btn" onclick="toggleAnswer(this, ${index})">Show Answer</button>
                        <div class="answer-box hidden" data-index="${index}">
                            <div class="answer-text">Answer: ${q.answer} - ${q.answerText}</div>
                            ${q.explanation ? `<div class="explanation">${q.explanation}</div>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Add click handlers to options
            document.querySelectorAll('.option-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    checkAnswer(e, this);
                });
            });
        }

        function checkAnswer(e, element) {
            const selected = element.getAttribute('data-answer');
            const correct = element.getAttribute('data-correct');
            const index = element.getAttribute('data-index');
            const optionsDiv = element.parentElement;
            const answerBox = document.querySelector(`.answer-box[data-index="${index}"]`);
            
            // Remove previous selection
            optionsDiv.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            element.classList.add('selected');

            // Show answer box
            if (answerBox) {
                answerBox.classList.add('show');
                answerBox.classList.remove('hidden');

                if (selected === correct) {
                    answerBox.classList.remove('incorrect');
                    answerBox.classList.add('correct');
                    answerBox.innerHTML = `
                        <div class="feedback-text">
                            <span class="feedback-icon">✅</span> CORRECT!
                        </div>
                    `;
                } else {
                    answerBox.classList.remove('correct');
                    answerBox.classList.add('incorrect');
                    answerBox.innerHTML = `
                        <div class="feedback-text">
                            <span class="feedback-icon">❌</span> INCORRECT
                        </div>
                        <div class="correct-answer">Correct answer: <strong>${correct}</strong></div>
                    `;
                }
            }
        }

        function toggleAnswer(btn, index) {
            const answerBox = document.querySelector(`.answer-box[data-index="${index}"]`);
            if (answerBox) {
                answerBox.classList.toggle('show');
            }
        }

        function resetFilters() {
            document.getElementById('classFilter').value = '';
            document.getElementById('topicFilter').value = '';
            document.getElementById('searchBox').value = '';
            filterQuestions();
        }

        window.onload = init;
    </script>
